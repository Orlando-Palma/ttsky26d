# Tiny Tapeout project information (TTSKY26d)
project:
  title:        "2nd-Order CT Sigma-Delta Modulator with 8-Tap FIR DAC"
  author:       "Orlando A. Palmas"
  discord:      ""
  description:  "2nd-order Continuous-Time Sigma-Delta (CTSD) ADC modulator in sky130A with an 8-tap FIR feedback DAC and ELD compensation achieving 97.6 dB SNDR."
  language:     "Analog"
  clock_hz:     10000000       # 10 MHz master sampling clock

  # Tile size: 2x2 analog/mixed-signal tile
  tiles: "2x2"

  # Top module name must match GDS/LEF cell name
  top_module:  "tt_um_ctsd_modulator"

  # Source files (blackbox stub for analog/custom GDS flow)
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "bitstream_p (1-bit PDM digital output)"
  uo[1]: "bitstream_n (Complementary PDM digital output)"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "vin_p (Differential positive analog input)"
  ua[1]: "vin_n (Differential negative analog input)"
  ua[2]: "vcm (Common-mode reference voltage 0.90 V)"
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

